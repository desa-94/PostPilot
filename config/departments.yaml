# PostPilot department and rule configuration (TEMPLATE).
# Versioned in the repo, placeholders only. Put real addresses/signatures in
# config/departments.local.yaml (gitignored). The router auto-selects the local
# file when present.
#
# Scoring: sender rules are a strong signal, keyword rules are weak and additive.
# Per letter the scores per department are summed; highest wins. Below
# fallback.min_score or a tie -> held for review.
#
# Placeholders available in subject_template / body_template:
#   {sender} {date} {recipient} {department} {score}

departments:
  - name: "TAX"
    email: "tax@example.com"
    batch_mode: true
    subject_template: "TAX Letter"
    body_template: |
      Thanks and best regards,

      <Name>
      <Role>
      <Department>
    rules:
      senders:
        - {pattern: "Finanzamt",   score: 50}
        - {pattern: "Steuerkasse", score: 40}
      keywords:
        - {pattern: "Steuernummer",   score: 10}
        - {pattern: "Umsatzsteuer",   score: 10}
        - {pattern: "Aktenzeichen",   score: 5}
        - {pattern: "Pfändung",       score: 5}
        - {pattern: "Vollstreckung",  score: 5}
    # Sub-routing inside TAX by the address line. Order = priority; highest wins.
    # No subroute over subroute_min_score, or a tie -> review.
    # 'pattern' is an exact regex. 'fuzzy' is an optional human-readable term for
    # OCR-tolerant rapidfuzz matching (never fuzzy-match the raw regex).
    subroute_min_score: 40
    subroutes:
      - name: "DETAINTAKE"
        email: "detaintake@example.com"
        patterns:
          - {pattern: "3\\s?P\\s?VAT",  fuzzy: "3P VAT",         score: 50}
          - {pattern: "Tax\\s?depar",   fuzzy: "Tax department",  score: 50}
      - name: "GARNISHMENT"
        email: "garnishment@example.com"
        patterns:
          - {pattern: "Garnishm[a-z]{0,3}", fuzzy: "Garnishment", score: 50}

fallback:
  department: "UNGEKLAERT"
  email: "mailroom@example.com"
  min_score: 20

# Outlook folder that --fetch pulls scanned PDF attachments from.
# Adjust to your mailbox (see: py -m postpilot.outlook_client --list-folders).
scantome:
  folder: "Inbox/ScanToMe"
  only_unread: true
